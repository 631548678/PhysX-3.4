name: Build PhysX 3.4 Android arm64

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build Config'
        required: true
        default: 'checked'
        type: choice
        options: [debug, checked, profile, release]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r16b
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r16b
          add-to-path: true

      - name: Audit, Patch & Smoke Test
        shell: pwsh
        env:
          RAW_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          $ErrorActionPreference = "Stop"
          $ndkWin = $env:RAW_NDK.TrimEnd('\', '/')
          $ndk = $ndkWin -replace '\\', '/'

          # 1. 体检 NDK 工具链与 Unified Headers
          $gxx = "$ndk/toolchains/aarch64-linux-android-4.9/prebuilt/windows-x86_64/bin/aarch64-linux-android-g++.exe"
          $sysroot = "$ndk/sysroot"
          $inc1 = "$sysroot/usr/include"
          $inc2 = "$sysroot/usr/include/aarch64-linux-android"
          if (-not (Test-Path $gxx) -or -not (Test-Path "$inc1/stdint.h")) {
            Write-Error "NDK toolchain or Unified Headers missing!"
          }

          # 2. 定位 PhysX_3.4 编译目录并挂载 Externals 软链接
          $dirObj = Get-ChildItem -Path "PhysX_3.4" -Recurse -Directory -Filter "android*" |
            Where-Object { $_.FullName -match "compiler" } | Select-Object -Last 1
          if (-not $dirObj) { Write-Error "No compiler/android* directory in PhysX_3.4!" }
          $buildDir = $dirObj.FullName
          "BUILD_DIR=$buildDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NDK_POSIX=$ndk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # 同时收集 PhysX_3.4 和 PxShared 下的所有 android 编译目录
          $allAndroidDirs = Get-ChildItem -Path "." -Recurse -Directory -Filter "android*" |
            Where-Object { $_.FullName -match "compiler" }

          $extRoot = (Resolve-Path "Externals").Path
          $allMkText = ($allAndroidDirs | ForEach-Object { Get-ChildItem -Path $_.FullName -Recurse -File } | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $ndkNames = [regex]::Matches($allMkText, "Externals/(android-ndk-[a-zA-Z0-9._-]+)") |
            ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          if (-not $ndkNames) { $ndkNames = @("android-ndk-r9d", "android-ndk-r13b", "android-ndk-r16b") }
          foreach ($name in $ndkNames) {
            $lnk = Join-Path $extRoot $name
            if (Test-Path $lnk) { Remove-Item $lnk -Force -Recurse }
            New-Item -ItemType Junction -Path $lnk -Target $ndkWin | Out-Null
          }

          # 3. 修补 PhysX_3.4 和 PxShared 下所有的 android Makefile
          $sysrootFlags = "--sysroot=$sysroot -isystem $inc1 -isystem $inc2 -D__ANDROID_API__=21"
          $injectFlags = "-fpic -std=c++11 $sysrootFlags"
          "SYSROOT_FLAGS=$sysrootFlags" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          foreach ($aDir in $allAndroidDirs) {
            foreach ($f in (Get-ChildItem -Path $aDir.FullName -Recurse -File)) {
              $t = Get-Content $f.FullName -Raw
              $o = $t
              $t = $t -replace "-g0", "-g"
              $t = $t -replace "gnu-libstdc\+\+/4\.8", "gnu-libstdc++/4.9"
              $t = $t -replace "armeabi-v7a", "arm64-v8a"
              $t = $t -replace "arm-linux-androideabi-4\.8", "aarch64-linux-android-4.9"
              $t = $t -replace "arm-linux-androideabi-", "aarch64-linux-android-"
              $t = $t -replace "prebuilt/windows/", "prebuilt/windows-x86_64/"
              $t = $t -replace "arch-arm\b", "arch-arm64"
              $t = $t -replace "android-(9|16)", "android-21"
              # 修复 r16b 移除 platforms/android-21/arch-arm64/usr/include 导致的 sysroot 失效
              $t = $t -replace "--sysroot=[^\s`"']+", "--sysroot=$sysroot"
              $t = $t -replace "-D__ARM_ARCH_5[A-Z0-9_]*|-march=armv7-a|-mfpu=neon|-mfloat-abi=softfp|-mthumb-interwork|-marm", ""
              $t = $t -replace "-fpic\b", $injectFlags
              if ($t -ne $o) { Set-Content -Path $f.FullName -Value $t -NoNewline }
            }
          }

          # 4. 单文件冒烟编译检查（确保头文件与 STL 100% 畅通后再跑全量编译）
          $smokeObj = "$env:TEMP\smoke_test.o"
          & $gxx -c "PxShared/src/foundation/src/PsAllocator.cpp" -o $smokeObj `
            -IPxShared/include -IPxShared/src/foundation/include `
            -I"$ndk/sources/cxx-stl/gnu-libstdc++/4.9/include" `
            -I"$ndk/sources/cxx-stl/gnu-libstdc++/4.9/libs/arm64-v8a/include" `
            --sysroot=$sysroot -isystem $inc1 -isystem $inc2 -D__ANDROID_API__=21 -DANDROID -std=c++11 -g
          if ($LASTEXITCODE -ne 0) { Write-Error "Smoke test failed! Headers or STL mismatch." }
          Remove-Item $smokeObj -Force -ErrorAction SilentlyContinue
          Write-Host "Audit & Smoke Test PASSED!"

      - name: Full Build (arm64-v8a with Symbols)
        shell: pwsh
        env:
          CONFIG: ${{ github.event.inputs.build_config || 'checked' }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_DIR
          $make = Get-ChildItem -Path $env:NDK_POSIX -Recurse -File -Filter "make.exe" | Select-Object -First 1 -ExpandProperty FullName
          $mkContent = Get-Content "Makefile" -Raw
          $target = if ($mkContent -match "$($env:CONFIG)-arm64-v8a") { "$($env:CONFIG)-arm64-v8a" } else { $env:CONFIG }

          & $make $target -j $env:NUMBER_OF_PROCESSORS `
            "ANDROID_NDK_ROOT=$($env:NDK_POSIX)" `
            "NDKROOT=$($env:NDK_POSIX)" `
            "APP_ABI=arm64-v8a" `
            "STRIP=echo"
          $code = $LASTEXITCODE

          $libs = Get-ChildItem -Path (Resolve-Path "../../..") -Recurse -File -Include *.a, *.so -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "android" -and $_.FullName -notmatch "[\\/](Externals|\.git)[\\/]" }
          if ($code -ne 0 -and -not $libs) { throw "Build failed with exit code $code" }
          if ($code -ne 0) { $global:LASTEXITCODE = 0 }

      - name: Verify AArch64 & Debug Symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libs = Get-ChildItem -Path "PhysX_3.4" -Recurse -File -Include *.a, *.so | Where-Object { $_.FullName -match "android" }
          if (-not $libs) { Write-Error "No Android libraries produced!" }
          $libs | ForEach-Object { Write-Host $_.FullName }

          $readelf = Get-ChildItem -Path $env:NDK_POSIX -Recurse -File -Filter "aarch64-linux-android-readelf.exe" | Select-Object -First 1 -ExpandProperty FullName
          $sample = ($libs | Where-Object { $_.Name -match "PhysX" } | Select-Object -First 1).FullName
          if (-not $sample) { $sample = ($libs | Select-Object -First 1).FullName }

          & $readelf -h "$sample" | Select-String "Machine:"
          & $readelf -S "$sample" | Select-String "debug_info|debug_line" | Select-Object -First 5

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: physx-3.4-android-arm64-${{ github.event.inputs.build_config || 'checked' }}-symbols
          path: |
            PhysX_3.4/Bin/android*/
            PhysX_3.4/Lib/android*/
            PhysX_3.4/Include/
            PxShared/include/
